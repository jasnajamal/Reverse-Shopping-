<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Dashboard - Reverse Shopping</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'marketplace/style.css' %}">
</head>

<body>

    <div class="top-bar">
        <h1>Seller Dashboard</h1>
        <p>Welcome, {{ seller.name }}</p>
    </div>

    <div class="container">

        <div class="card">
            <h2>Manage Your Selling Activities</h2>

            <p>
                View matching buyer requirements, submit competitive offers,
                and manage your submitted offers.
            </p>

            <div class="actions">

                <a href="/buyer-requirements/">
                    <button>View Buyer Requirements</button>
                </a>

                <a href="/my-offers/">
                    <button>My Offers</button>
                </a>

                <a href="/selected-orders/">
                    <button>Selected Orders</button>
                </a>

                <a href="/profile/">
                    <button>My Profile</button>
                </a>
                
                <a href="/notifications/">
                    <button>🔔 Notifications</button>
                </a>

                <a href="/logout/">
                    <button>Logout</button>
                </a>

            </div>
        </div>

    </div>

</body>
</html>
