
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Offer - Reverse Shopping</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'marketplace/style.css' %}">
</head>

<body>

    <div class="top-bar">
        <h1>Update Offer</h1>
    </div>

    <div class="container">

        <div class="card">

            <h2>Your Product</h2>

            <form method="POST">
                {% csrf_token %}

                <label>Product Name:</label>
                <input
                    type="text"
                    name="product_name"
                    value="{{ product.product_name }}"
                    required
                >

                <label>Product Description:</label>
                <textarea name="product_description">{{ product.description|default:"" }}</textarea>

                <label>Product Price:</label>
                <input
                    type="number"
                    name="product_price"
                    step="0.01"
                    value="{{ product.price }}"
                    required
                >

                <label>Condition:</label>
                <select name="condition_type" required>
                    <option value="new" {% if product.condition_type == "new" %}selected{% endif %}>
                        New
                    </option>

                    <option value="used" {% if product.condition_type == "used" %}selected{% endif %}>
                        Used
                    </option>
                </select>

                <label>Brand:</label>
                <input
                    type="text"
                    name="brand"
                    value="{{ product.brand|default:"" }}"
                >

                <h2>Offer Details</h2>

                <label>Your Offer Price:</label>
                <input
                    type="number"
                    name="offer_price"
                    step="0.01"
                    value="{{ offer.offer_price }}"
                    required
                >

                <label>Delivery Days:</label>
                <input
                    type="number"
                    name="delivery_days"
                    value="{{ offer.delivery_days|default:"" }}"
                >

                <label>Warranty:</label>
                <input
                    type="text"
                    name="warranty"
                    value="{{ offer.warranty|default:"" }}"
                >

                <label>Message to Buyer:</label>
                <textarea name="message">{{ offer.message|default:"" }}</textarea>

                <button type="submit">Update Offer</button>

            </form>

        </div>

        <a href="/buyer-requirements/">
            <button>Back to Buyer Requirements</button>
        </a>

    </div>

</body>
</html>
