<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buyer Dashboard - Reverse Shopping</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'marketplace/style.css' %}">
</head>

<body>

    <div class="top-bar">
        <h1>Buyer Dashboard</h1>
        <p>Welcome to Reverse Shopping</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>Manage Your Shopping Requirements</h2>

            <p>
                Post what you need and compare competitive seller offers.
            </p>

            <div class="actions">

                <a href="/post-requirement/">
                    <button>Post Product Requirement</button>
                </a>

                <a href="/my-requirements/">
                    <button>My Requirements</button>
                </a>

                <a href="/logout/">
                    <button>Logout</button>
                </a>

            </div>

        </div>

    </div>

</body>
</html>
